name: Prune GHCR images

on:
  schedule:
    - cron: '0 20 * * 0'
  workflow_dispatch: {}

jobs:
  prune:
    name: "prune / ${{ matrix.package }}"
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        package:
          - mirai-inventory-service
          - mirai-forecasting-service
          - mirai-messaging-service
          - mirai-web
    steps:
      - name: Delete old versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.package }}
          package-type: container
          org: multi-agent-logistics-inventory-planner
          min-versions-to-keep: 10
          ignore-versions: '^latest$'
