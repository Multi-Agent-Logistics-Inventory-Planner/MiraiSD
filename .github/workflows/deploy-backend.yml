name: Deploy Backend to Hetzner

on:
  push:
    branches:
      - main
    paths:
      - 'services/**'
      - 'infra/**'
      - '.github/workflows/deploy-backend.yml'

  # Allow manual trigger
  workflow_dispatch:

env:
  DEPLOY_PATH: /opt/mirai

jobs:
  deploy:
    name: Deploy Backend Services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history: a push can bundle multiple commits, and the "Detect
          # changed services" step below needs to diff against the commit that
          # was HEAD before this push (github.event.before), which a shallow
          # fetch-depth: 2 checkout may not contain.
          fetch-depth: 0

      - name: Detect changed services
        id: changes
        run: |
          # Diff against the commit that was HEAD before this push, not just
          # HEAD~1 - a push can bundle multiple commits, and HEAD~1 only ever
          # looks at the last one, silently missing changes from earlier
          # commits in the same push. github.event.before is empty/all-zero
          # for workflow_dispatch and for a brand-new branch's first push;
          # fall back to HEAD~1 in that case.
          BASE_SHA="${{ github.event.before }}"
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA=$(git rev-parse HEAD~1 2>/dev/null || echo "")
          fi

          if [ -n "$BASE_SHA" ]; then
            CHANGED_FILES=$(git diff --name-only "$BASE_SHA" HEAD 2>/dev/null || echo "")
          else
            CHANGED_FILES=""
          fi

          echo "Base SHA: $BASE_SHA"
          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Detect which services changed
          INVENTORY_CHANGED=false
          FORECASTING_CHANGED=false
          MESSAGING_CHANGED=false
          # docker-compose.yml defines every container's resolved config (env,
          # memory limits, etc), so a change there can affect any service - but
          # `docker compose up -d` already diffs each container's config against
          # what's running and only recreates ones that actually changed, so we
          # don't need to (and shouldn't) rebuild/restart everything for this.
          COMPOSE_CHANGED=false
          # Caddyfile only affects the caddy container - no image to rebuild.
          CADDY_CHANGED=false

          if echo "$CHANGED_FILES" | grep -q "^services/inventory-service/"; then
            INVENTORY_CHANGED=true
          fi

          if echo "$CHANGED_FILES" | grep -q "^services/forecasting-service/"; then
            FORECASTING_CHANGED=true
          fi

          if echo "$CHANGED_FILES" | grep -q "^services/messaging-service/"; then
            MESSAGING_CHANGED=true
          fi

          if echo "$CHANGED_FILES" | grep -q "^infra/docker-compose\.yml$"; then
            COMPOSE_CHANGED=true
          fi

          if echo "$CHANGED_FILES" | grep -q "^infra/Caddyfile$"; then
            CADDY_CHANGED=true
          fi

          echo "inventory_changed=$INVENTORY_CHANGED" >> $GITHUB_OUTPUT
          echo "forecasting_changed=$FORECASTING_CHANGED" >> $GITHUB_OUTPUT
          echo "messaging_changed=$MESSAGING_CHANGED" >> $GITHUB_OUTPUT
          echo "compose_changed=$COMPOSE_CHANGED" >> $GITHUB_OUTPUT
          echo "caddy_changed=$CADDY_CHANGED" >> $GITHUB_OUTPUT

          # Build list of services to rebuild (space-separated, no leading space)
          SERVICES_TO_REBUILD=""
          if [ "$INVENTORY_CHANGED" = "true" ]; then
            SERVICES_TO_REBUILD="${SERVICES_TO_REBUILD:+$SERVICES_TO_REBUILD }inventory-service"
          fi
          if [ "$FORECASTING_CHANGED" = "true" ]; then
            SERVICES_TO_REBUILD="${SERVICES_TO_REBUILD:+$SERVICES_TO_REBUILD }forecasting-service"
          fi
          if [ "$MESSAGING_CHANGED" = "true" ]; then
            SERVICES_TO_REBUILD="${SERVICES_TO_REBUILD:+$SERVICES_TO_REBUILD }messaging-service"
          fi

          echo "services_to_rebuild=$SERVICES_TO_REBUILD" >> $GITHUB_OUTPUT
          echo "Services to rebuild: $SERVICES_TO_REBUILD"

      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: ${{ secrets.DROPLET_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -ex

            echo "=== Deployment started at $(date) ==="

            # Navigate to project directory
            echo "Navigating to ${{ env.DEPLOY_PATH }}..."
            cd ${{ env.DEPLOY_PATH }}

            # Pull latest changes
            echo "Pulling latest changes from main..."
            git fetch origin main
            git reset --hard origin/main

            # Navigate to infra directory
            echo "Navigating to infra directory..."
            cd infra

            # Determine what to rebuild
            COMPOSE_CHANGED="${{ steps.changes.outputs.compose_changed }}"
            CADDY_CHANGED="${{ steps.changes.outputs.caddy_changed }}"
            SERVICES="${{ steps.changes.outputs.services_to_rebuild }}"
            IS_MANUAL="${{ github.event_name == 'workflow_dispatch' }}"

            echo "COMPOSE_CHANGED=$COMPOSE_CHANGED"
            echo "CADDY_CHANGED=$CADDY_CHANGED"
            echo "SERVICES=$SERVICES"
            echo "IS_MANUAL=$IS_MANUAL"

            if [ "$IS_MANUAL" = "true" ]; then
              # Manual trigger has no path diff to key off - do a full,
              # deliberate redeploy of every buildable service (never `web`,
              # which has no build: key by design - see docker-compose.yml).
              echo "Manual trigger. Rebuilding all backend services..."
              docker compose build --no-cache kafka inventory-service forecasting-service messaging-service
              docker compose up -d --remove-orphans
            else
              if [ -n "$SERVICES" ]; then
                echo "Building changed services: $SERVICES"
                for SERVICE in $SERVICES; do
                  docker compose build --no-cache $SERVICE
                done
              fi

              if [ "$COMPOSE_CHANGED" = "true" ]; then
                # docker-compose.yml can affect any service's resolved config.
                # `up -d` (no --force-recreate) diffs each container's config
                # (and, for rebuilt services, image ID) against what's running
                # and only recreates ones that actually differ, so this is safe
                # to run broadly - it will NOT touch `web` or any other service
                # whose config didn't change.
                echo "docker-compose.yml changed. Applying config (only changed services will restart)..."
                docker compose up -d --remove-orphans
              elif [ -n "$SERVICES" ]; then
                echo "Restarting changed services with zero-downtime..."
                for SERVICE in $SERVICES; do
                  docker compose up -d --no-deps --force-recreate $SERVICE
                done
              fi

              if [ "$CADDY_CHANGED" = "true" ]; then
                # Caddyfile is bind-mounted, not baked into an image, so a
                # content-only edit doesn't change caddy's resolved compose
                # config or image ID - `up -d` above won't detect it. Force a
                # restart so Caddy actually picks up the new file.
                echo "Caddyfile changed. Restarting caddy to pick up the new config..."
                docker compose up -d --no-deps --force-recreate caddy
              fi

              if [ -z "$SERVICES" ] && [ "$COMPOSE_CHANGED" != "true" ] && [ "$CADDY_CHANGED" != "true" ]; then
                echo "No service, compose, or Caddyfile changes detected (e.g. workflow file only). Nothing to redeploy."
              fi
            fi

            # Clean up old images
            echo "Cleaning up unused Docker images..."
            docker image prune -f

            # Wait for services to be healthy
            # Spring Boot on the CPX21 takes 2-3 minutes to initialize
            # (revisit after the heap was raised from 192m to 512m)
            echo "Waiting for services to become healthy..."
            sleep 180

            # Check service health
            echo "Checking service health..."
            docker compose ps

            # Show recent logs for verification
            echo "=== Recent logs ==="
            docker compose logs --tail=20

            echo "=== Deployment completed at $(date) ==="

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: ${{ secrets.DROPLET_PORT || 22 }}
          script: |
            cd ${{ env.DEPLOY_PATH }}/infra

            # Check if all services are running
            RUNNING=$(docker compose ps --format json | jq -r '.State' | grep -c "running" || echo "0")
            TOTAL=$(docker compose ps --format json | jq -r '.State' | wc -l)

            echo "Services running: $RUNNING / $TOTAL"

            # Health check on inventory-service
            if curl -sf http://localhost:4000/actuator/health > /dev/null 2>&1; then
              echo "inventory-service health check: PASSED"
            else
              echo "inventory-service health check: FAILED"
              exit 1
            fi

            echo "Deployment verification completed successfully"

      - name: Notify on failure
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: ${{ secrets.DROPLET_PORT || 22 }}
          script: |
            cd ${{ env.DEPLOY_PATH }}/infra
            echo "=== Deployment failed. Checking logs ==="
            docker compose logs --tail=50
