name: CI

# Triggered directly on pull_request/push, AND reused by pr-gate.yml via
# workflow_call so the same jobs aren't billed twice for one push on an open
# PR (push:main only fires after merge, when there's no open PR to double up
# with). See docs/runbooks/ci-cd-pipeline.md §1.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      inventory_changed: ${{ steps.detect.outputs.inventory_changed }}
      forecasting_changed: ${{ steps.detect.outputs.forecasting_changed }}
      messaging_changed: ${{ steps.detect.outputs.messaging_changed }}
      web_changed: ${{ steps.detect.outputs.web_changed }}
      packages_changed: ${{ steps.detect.outputs.packages_changed }}
      web_or_packages_changed: ${{ steps.detect.outputs.web_or_packages_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        uses: ./.github/actions/detect-changes

  # ---------------------------------------------------------------------
  # unit-test: per-deployable unit tests, no Docker, no Testcontainers.
  # Testcontainers-backed integration tests live in pr-gate.yml's
  # integration-test job instead, see docs/runbooks/ci-cd-pipeline.md §1/§2.
  # ---------------------------------------------------------------------

  unit-test-web:
    name: "unit-test / web"
    needs: changes
    if: needs.changes.outputs.web_or_packages_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      # The repo is an npm workspace (root package.json), so one `npm ci` at the repo
      # root installs and hoists every workspace member's dependencies - including
      # packages/api-client's own openapi-fetch - into one node_modules tree.
      - run: npm ci
      - run: npm run test:run
        working-directory: apps/web

  unit-test-inventory-service:
    name: "unit-test / inventory-service"
    needs: changes
    if: needs.changes.outputs.inventory_changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/inventory-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      # No maven-failsafe-plugin is configured, so plain `mvn test` (Surefire's
      # default include pattern) already excludes *IT.java classes without any
      # -Dtest override. The Testcontainers-backed integration tests
      # (BaseKafkaIntegrationTest, CoinAdminDashboardServiceIT) run separately
      # in pr-gate.yml's integration-test job with an explicit -Dtest='*IT'.
      - run: mvn -B test

  # ---------------------------------------------------------------------
  # contracts-check: regenerates packages/contracts/openapi.json and
  # packages/api-client/src/schema.d.ts and fails if either drifts from
  # what's checked in, so an endpoint change without a regeneration step is
  # caught here instead of silently shipping a stale generated client. Also
  # runs oasdiff against the pre-change contract and fails on breaking
  # changes (removed/renamed routes or fields, widened requirements, etc.) -
  # the compatibility check required by multi-site-data-and-api.md §7 and
  # client-applications.md §4.
  # ---------------------------------------------------------------------

  contracts-check:
    name: OpenAPI contract and client freshness
    needs: changes
    if: needs.changes.outputs.inventory_changed == 'true' || needs.changes.outputs.packages_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so `git show <base>:packages/contracts/openapi.json` below can reach
          # the pre-change contract for the oasdiff breaking-change comparison.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Regenerate packages/contracts/openapi.json
        working-directory: services/inventory-service
        run: mvn -B -Dtest=OpenApiContractExportTest test
      - name: Fail if the checked-in contract is stale
        run: git diff --exit-code packages/contracts/openapi.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      # The repo is an npm workspace (root package.json), so one `npm ci` at the repo
      # root installs packages/api-client's dependencies too - no separate install
      # inside packages/api-client needed.
      - run: npm ci
      - name: Regenerate packages/api-client/src/schema.d.ts
        working-directory: packages/api-client
        run: npm run generate
      - name: Fail if the checked-in generated client is stale
        run: git diff --exit-code packages/api-client/src/schema.d.ts
      - name: Typecheck the generated client
        working-directory: packages/api-client
        run: npm run typecheck
      - name: Resolve base contract for compatibility check
        id: base-contract
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
              BASE_SHA=$(git rev-parse HEAD~1 2>/dev/null || echo "")
            fi
          fi

          # No base commit (repo's first commit) or the contract didn't exist yet at that
          # commit (e.g. this PR is the one introducing it) - nothing to compare against.
          # Written under the workspace, not host /tmp: oasdiff-action below runs as a Docker
          # action, which only ever sees the repo checkout mounted at /github/workspace - a host
          # /tmp path would be invisible to it.
          mkdir -p .tmp
          if [ -n "$BASE_SHA" ] && git show "$BASE_SHA:packages/contracts/openapi.json" > .tmp/base-openapi.json 2>/dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Fail on breaking API changes
        if: steps.base-contract.outputs.found == 'true'
        uses: oasdiff/oasdiff-action/breaking@v0.1.13
        with:
          base: .tmp/base-openapi.json
          revision: packages/contracts/openapi.json
          fail-on: ERR
          # Uploading the spec to oasdiff.com for a shareable review link is opt-in
          # elsewhere; disabled here so the contract never leaves CI.
          review: false
          github-token: ''

  unit-test-forecasting-service:
    name: "unit-test / forecasting-service"
    needs: changes
    if: needs.changes.outputs.forecasting_changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/forecasting-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: services/forecasting-service/pyproject.toml
      # Installs prophet/cmdstanpy (compiled Stan models) — this step is the
      # slow part of this job; expect it to dominate the run time.
      - run: pip install -e ".[dev]"
      - run: pytest tests/

  unit-test-messaging-service:
    name: "unit-test / messaging-service"
    needs: changes
    if: needs.changes.outputs.messaging_changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/messaging-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: services/messaging-service/requirements.txt
      - run: pip install -r requirements.txt
      # Deliberately scoped to tests/ only, NOT the whole service directory:
      # several root-level test_*.py files here (test_slack.py,
      # test_full_pipeline.py, test_full_flow.py, test_notifications.py) are
      # manual CLI scripts with a `main()` entrypoint that send real Slack
      # messages / hit real external services when executed — they are not
      # pytest suites despite the test_ prefix, and must never run unattended
      # in CI. pyproject.toml already scopes `testpaths = ["tests"]`, so
      # `pytest` alone would already respect this; the explicit tests/
      # argument here is belt-and-suspenders so this stays correct even if
      # that config ever changes.
      - run: pytest tests/

  # ---------------------------------------------------------------------
  # build: typecheck only. No `mvn compile` job exists — mvn test in
  # unit-test-inventory-service already compiles main and test sources, so a
  # separate compile job would cost a runner and catch nothing extra.
  # ---------------------------------------------------------------------

  build-web:
    name: "build / web (typecheck)"
    needs: changes
    if: needs.changes.outputs.web_or_packages_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # No "typecheck" npm script exists; run tsc directly against the project config.
      - run: npx tsc --noEmit
        working-directory: apps/web

  # ---------------------------------------------------------------------
  # static-analysis: lint + free dependency scan. Container image scanning
  # (trivy image) is a different check and lives in deploy.yml — see
  # docs/runbooks/ci-cd-pipeline.md §3.
  # ---------------------------------------------------------------------

  static-analysis:
    name: Static analysis
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install (web)
        if: needs.changes.outputs.web_or_packages_changed == 'true'
        run: npm ci

      - name: ESLint (web)
        if: needs.changes.outputs.web_or_packages_changed == 'true'
        working-directory: apps/web
        run: npm run lint

      # No Checkstyle/Spotless plugin is currently bound in
      # services/inventory-service/pom.xml, so there is no Java lint step
      # here yet — adding one means picking and configuring a plugin first,
      # which is separate work from this pipeline migration.

      - name: ruff (forecasting-service)
        if: needs.changes.outputs.forecasting_changed == 'true'
        working-directory: services/forecasting-service
        run: |
          pip install ruff
          ruff check .

      - name: ruff (messaging-service)
        if: needs.changes.outputs.messaging_changed == 'true'
        working-directory: services/messaging-service
        run: |
          pip install ruff
          ruff check .

      - name: trivy fs (dependency CVEs)
        # Pinned to the tag, not a SHA: aquasecurity/trivy-action had a supply
        # chain incident in 2025 that motivated their move to signed "v"
        # releases. SHA-pinning is worth revisiting once Actions minutes are
        # being tracked seriously (see docs/runbooks/ci-cd-pipeline.md §0).
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '0' # report-only at this stage; deploy.yml's image scan is the gate
